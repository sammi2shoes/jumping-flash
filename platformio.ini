[env:m5stick-c-plus]
platform = https://github.com/platformio/platform-espressif32.git#4d72e44ebe60c2fde58496f9a72a0e0dd4861cf7
board = m5stick-c
framework = arduino
monitor_speed = 115200
board_build.partitions = huge_app.csv
platform_packages =
    framework-arduinoespressif32@file://${sysenv.JUMPING_FLASH_TOOLS}/bluepad32
    toolchain-xtensa-esp32@file://${sysenv.JUMPING_FLASH_TOOLS}/xtensa-esp32-elf
    tool-esptoolpy@file://${sysenv.JUMPING_FLASH_TOOLS}/esptool
lib_deps =
    https://github.com/m5stack/M5GFX.git#cc613d65f13a3a80021ef264a654e9e6a2419d8a
    https://github.com/m5stack/M5Unified.git#bf322a062657aae49b2a93e2ca87351769f7b440
build_flags = -DENABLE_BLUEPAD32=0
build_src_filter = -<*> +<main.cpp>

[env:controller-test]
extends = env:m5stick-c-plus
build_flags = -DENABLE_BLUEPAD32=1

[env:can-bench]
extends = env:m5stick-c-plus
build_src_filter = -<*> +<can_bench.cpp>

[env:motor-telemetry]
extends = env:m5stick-c-plus
build_src_filter = -<*> +<motor_telemetry.cpp>

[env:motor-jog]
extends = env:m5stick-c-plus
build_src_filter = -<*> +<motor_jog.cpp>

[env:watchdog-diagnostic]
extends = env:m5stick-c-plus
build_src_filter = -<*> +<watchdog_diagnostic.cpp>

[env:motorstudio-capture]
extends = env:m5stick-c-plus
build_src_filter = -<*> +<motorstudio_capture.cpp>

[env:legacy-parameter-read]
extends = env:m5stick-c-plus
build_src_filter = -<*> +<legacy_parameter_read.cpp>

[env:legacy-setup]
extends = env:m5stick-c-plus
build_src_filter = -<*> +<legacy_setup.cpp>

[env:legacy-watchdog-test]
extends = env:m5stick-c-plus
build_src_filter = -<*> +<legacy_watchdog_test.cpp>

[env:position-step]
extends = env:m5stick-c-plus
build_src_filter = -<*> +<position_step.cpp>

[env:post-update-diagnostic]
extends = env:m5stick-c-plus
build_src_filter = -<*> +<post_update_diagnostic.cpp>

[env:watchdog-observer]
extends = env:m5stick-c-plus
build_src_filter = -<*> +<watchdog_observer.cpp>

[env:motor-recovery]
extends = env:m5stick-c-plus
build_flags = -DENABLE_BLUEPAD32=1
build_src_filter = -<*> +<motor_recovery.cpp>

[env:ax12-single-leg]
extends = env:m5stick-c-plus
lib_ldf_mode = deep+
platform_packages =
    framework-arduinoespressif32@file://${sysenv.JUMPING_FLASH_TOOLS}/arduino-esp32-official
    toolchain-xtensa-esp32@file://${sysenv.JUMPING_FLASH_TOOLS}/xtensa-esp32-elf
    tool-esptoolpy@file://${sysenv.JUMPING_FLASH_TOOLS}/esptool
build_src_filter = -<*> +<ax12_single_leg.cpp>

[env:ax12-direction-test]
extends = env:ax12-single-leg
build_src_filter = -<*> +<ax12_direction_test.cpp>
