plugins { id 'com.android.application' }
android {
 namespace 'com.jumpingflash.ax12'
 signingConfigs { development { storeFile rootProject.file('development-signing.keystore'); storePassword 'android'; keyAlias 'androiddebugkey'; keyPassword 'android' } }
 buildTypes { debug { signingConfig signingConfigs.development } }
 compileSdk 35
 defaultConfig { applicationId 'com.jumpingflash.ax12'; minSdk 26; targetSdk 35; versionCode 1; versionName '0.1.0' }
 testOptions {
  unitTests.includeAndroidResources = true
  unitTests.all {
   def testHome = layout.buildDirectory.dir('test-home').get().asFile
   doFirst { testHome.mkdirs() }
   systemProperty 'user.home', testHome.absolutePath
   systemProperty 'robolectric.dependency.repo.url', 'https://repo.maven.apache.org/maven2'
   ['https.proxyHost','https.proxyPort','http.proxyHost','http.proxyPort','javax.net.ssl.trustStore'].each { key -> if (System.getProperty(key) != null) systemProperty key, System.getProperty(key) }
  }
 }
 compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
}

dependencies { testImplementation 'junit:junit:4.13.2'; testImplementation 'org.robolectric:robolectric:4.14.1' }
