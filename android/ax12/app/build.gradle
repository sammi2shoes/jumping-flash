plugins { id 'com.android.application' }
android {
 namespace 'com.jumpingflash.ax12'
 signingConfigs { development { storeFile rootProject.file('development-signing.keystore'); storePassword 'android'; keyAlias 'androiddebugkey'; keyPassword 'android' } }
 buildTypes { debug { signingConfig signingConfigs.development } }
 compileSdk 35
 defaultConfig { applicationId 'com.jumpingflash.ax12'; minSdk 28; targetSdk 35; versionCode 9; versionName '0.6.1' }
 testOptions {
  unitTests.includeAndroidResources = true
  unitTests.all {
   def testHome = layout.buildDirectory.dir('test-home').get().asFile
   doFirst { testHome.mkdirs() }
   systemProperty 'user.home', testHome.absolutePath
   systemProperty 'robolectric.dependency.repo.url', 'https://repo.maven.apache.org/maven2'
   ['https.proxyHost','https.proxyPort','http.proxyHost','http.proxyPort','javax.net.ssl.trustStore'].each { key -> if (System.getProperty(key) != null) systemProperty key, System.getProperty(key) }
  }
 }
 compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
}

dependencies { testImplementation 'junit:junit:4.13.2'; testImplementation 'org.robolectric:robolectric:4.14.1' }

// Prebuilt JNI keeps normal builds small; fail if source or binary changed without rebuilding.
tasks.register('verifyNativeProbe') {
 def source = file('src/main/cpp/uart_probe.c')
 def binary = file('src/main/jniLibs/arm64-v8a/libjf_uart_probe.so')
 def stamp = file('src/main/cpp/uart_probe.build.json')
 inputs.files(source, binary, stamp)
 doLast {
  def record = new groovy.json.JsonSlurper().parse(stamp)
  def digest = { f -> java.security.MessageDigest.getInstance('SHA-256').digest(f.bytes).encodeHex().toString() }
  if (digest(source) != record.source_sha256 || digest(binary) != record.binary_sha256)
   throw new GradleException('Native probe source/binary mismatch. Run scripts/build_ax12_uart_probe.sh with NDK r27c.')
 }
}
tasks.named('preBuild') { dependsOn 'verifyNativeProbe' }
